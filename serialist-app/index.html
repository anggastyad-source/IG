<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Serialist</title>
<meta name="description" content="Write your web novel on your phone, and plot it forward in Plotfeed.">
<meta name="theme-color" content="#EDF1F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Serialist">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/literata-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<datalist id="dl-langs"><option value="English"><option value="Bahasa Indonesia"><option value="Español"><option value="Português"><option value="Filipino"><option value="Français"><option value="Deutsch"><option value="Tiếng Việt"><option value="Bahasa Melayu"></datalist>
<datalist id="dl-povs"><option value="First person"><option value="Third person limited"><option value="Third person omniscient"><option value="Second person"></datalist>
<datalist id="dl-roles"><option value="Protagonist"><option value="Antagonist"><option value="Love interest"><option value="Mentor"><option value="Rival"><option value="Ally"><option value="Sidekick"><option value="Family"></datalist>

<main class="app" id="v-library"></main>
<main class="app" id="v-novel" hidden></main>
<main class="v-editor" id="v-editor" hidden></main>
<div class="scrim" id="scrim" hidden data-act="close-sheet"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" role="status" hidden></div>

<script src="app.js"></script>
</body>
</html>
